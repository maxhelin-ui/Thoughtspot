<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TS Custom Chart</title>
        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://code.highcharts.com/highcharts-more.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/numeral.js/2.0.6/numeral.min.js"></script>
        <script src="https://blacklabel.github.io/custom_events/customEvents.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            #buttonContainer {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 6px;
                padding: 4px 40px 4px 80px;
                box-sizing: border-box;
            }
            #sliceToggles {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
                align-items: center;
            }
            #customLegend {
                display: flex;
                gap: 14px;
                flex-wrap: wrap;
                align-items: center;
                justify-content: flex-end;
                flex-shrink: 0;
                margin-left: auto;
            }
            .legend-item {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                background: none;
                border: none;
                padding: 2px 4px;
                cursor: pointer;
                font-family: 'Lucida Grande', 'Lucida Sans Unicode', Arial, Helvetica, sans-serif;
                font-size: 12px;
                color: #333;
                font-weight: 500;
                transition: opacity 0.15s ease;
            }
            .legend-item:hover { opacity: 0.75; }
            .legend-item.legend-hidden {
                opacity: 0.4;
                text-decoration: line-through;
            }
            .legend-item.legend-hidden .legend-swatch { opacity: 0.5; }
            .legend-swatch {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 2px;
                flex: 0 0 auto;
            }
            .measure-button {
                padding: 6px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background: #f5f5f5;
                cursor: pointer;
                font-size: 13px;
            }
            .measure-button.active-measure {
                background: #1a73e8;
                color: white;
                border-color: #1a73e8;
            }
            .slice-toggle-btn {
                display: inline-flex;
                align-items: center;
                padding: 5px 14px;
                border: 1px solid #d0d7de;
                border-radius: 999px;
                background: #fff;
                color: #4a5568;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.15s ease;
                font-family: inherit;
            }
            .slice-toggle-btn:hover {
                border-color: #2d72d2;
                color: #2d72d2;
            }
            .slice-toggle-btn.active {
                background: #2d72d2;
                border-color: #2d72d2;
                color: #fff;
            }
            #chart {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div style="width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column;">
            <div id="buttonContainer">
                <div id="sliceToggles"></div>
                <div id="customLegend"></div>
            </div>
            <div id="chart" style="flex: 1; min-height: 0;"></div>
        </div>
        <script type="module" src="bar_chart.ts"></script>
    </body>
</html>
