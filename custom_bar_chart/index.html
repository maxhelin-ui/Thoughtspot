<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TS Custom Chart</title>
        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/numeral.js/2.0.6/numeral.min.js"></script>
        <script src="https://blacklabel.github.io/custom_events/customEvents.js"></script>
        <style>
            body {
                margin: 0;
                padding: 0;
            }
            #buttonContainer {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px;
            }
            .measure-button {
                padding: 6px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                background: #f5f5f5;
                cursor: pointer;
                font-size: 13px;
            }
            .measure-button.active-measure {
                background: #1a73e8;
                color: white;
                border-color: #1a73e8;
            }
            #chart {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div style="width: 99vw; height: 95vh; position: relative; display: flex; flex-direction: column;">
            <div id="buttonContainer"></div>
            <div id="chart" style="flex: 1;"></div>
        </div>
        <script type="module" src="bar_chart.ts"></script>
    </body>
</html>
