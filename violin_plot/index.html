<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Violin Plot</title>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                overflow: hidden;
                background: #FFFFFF;
                font-family: 'Optimo-Plain', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            }
            #layout {
                display: grid;
                grid-template-rows: auto 1fr auto;
                grid-template-columns: 1fr;
                grid-template-areas:
                    "top"
                    "chart"
                    "bottom";
                width: 100vw;
                height: 100vh;
                 overflow: hidden;
                box-sizing: border-box;
            }
            #topArea {
                grid-area: top;
            }
            #bottomArea {
                grid-area: bottom;
            }
            #chart {
                grid-area: chart;
                min-width: 0;
                min-height: 0;
            }
            #topArea, #bottomArea {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
                padding: 8px 16px;
                box-sizing: border-box;
                overflow: hidden;
            }
            .button-group {
                display: flex;
                justify-content: center;
                align-items: center;
                flex-wrap: wrap;
                gap: 6px;
            }
            .category-toggle-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                padding: 5px 14px;
                border: none;
                border-radius: 999px;
                background: #F1F2F4;
                color: #1A1F2C;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: background 0.15s ease, color 0.15s ease;
                font-family: Optimo-Plain, "Helvetica Neue", Helvetica, Arial, sans-serif;
                white-space: nowrap;
            }
            .category-toggle-btn:hover {
                background: #E4E6EA;
            }
            .category-toggle-btn.active {
                background: #6B7280;
                color: #FFFFFF;
            }
        </style>
    </head>
    <body>
        <div id="layout">
            <div id="topArea"></div>
            <div id="chart"></div>
            <div id="bottomArea"></div>
        </div>
        <script type="module" src="violin_plot.ts"></script>
    </body>
</html>
