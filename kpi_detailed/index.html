<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI - Detailed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="card" class="ts-card">
    <!-- Split layout: 1..N primary cards (grid), then 0..M metric tiles
         — all inside a single grey card. -->
    <div id="splitLayout" class="ts-split hidden">
      <div class="ts-detail-card">
        <span class="ts-icon-corner" data-icon-slot aria-hidden="true"></span>
        <div id="primariesGrid" class="ts-split-grid"></div>
        <div id="metricsRow" class="ts-footer-metrics hidden"></div>
      </div>
    </div>

    <!-- Main + Secondaries layout: big primary, then 0..N metric/footer rows -->
    <div id="mainSecLayout" class="ts-main-sec hidden">
      <div class="ts-detail-card">
        <span class="ts-icon-corner" data-icon-slot aria-hidden="true"></span>
        <div id="msPrimary" class="ts-stat-row">
          <span id="msPrimaryValue" class="ts-stat-big"></span>
          <span id="msPrimaryDescription" class="ts-stat-desc"></span>
        </div>
        <div id="msRows"></div>
      </div>
    </div>

    <!-- Empty state -->
    <div id="emptyState" class="ts-empty hidden"></div>
  </div>

  <script type="module" src="main.js" defer></script>
</body>
</html>
