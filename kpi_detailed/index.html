<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI - Detailed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="card" class="ts-card">
    <!-- Single-stat layout -->
    <div id="singleLayout" class="ts-single hidden">
      <div class="ts-detail-card">
        <span class="ts-icon-corner" data-icon-slot aria-hidden="true"></span>
        <div id="singleStatRow" class="ts-stat-row">
          <span id="singleValue" class="ts-stat-big"></span>
          <span id="singleSuffix" class="ts-stat-suffix"></span>
          <span id="singleDescription" class="ts-stat-desc"></span>
        </div>
        <div id="singleProgressRow" class="ts-progress-row">
          <div class="ts-progress-track">
            <div id="singleBarFill" class="ts-progress-fill"></div>
          </div>
          <span id="singlePercent" class="ts-progress-label"></span>
        </div>
        <div id="singleFooter" class="ts-stat-footer"></div>
      </div>
    </div>

    <!-- Split-stat layout -->
    <div id="splitLayout" class="ts-split hidden">
      <div class="ts-detail-card">
        <span class="ts-icon-corner" data-icon-slot aria-hidden="true"></span>
        <div class="ts-split-grid">
          <div id="splitLeftSide" class="ts-split-side">
            <div id="leftLabel" class="ts-side-label"></div>
            <div class="ts-stat-row">
              <span id="leftValue" class="ts-stat-medium"></span>
              <span id="leftSuffix" class="ts-stat-suffix"></span>
            </div>
            <div id="leftProgressRow" class="ts-progress-row">
              <div class="ts-progress-track">
                <div id="leftBarFill" class="ts-progress-fill"></div>
              </div>
              <span id="leftPercent" class="ts-progress-label"></span>
            </div>
          </div>
          <div id="splitDivider" class="ts-split-divider"></div>
          <div id="splitRightSide" class="ts-split-side">
            <div id="rightLabel" class="ts-side-label"></div>
            <div class="ts-stat-row">
              <span id="rightValue" class="ts-stat-medium"></span>
              <span id="rightSuffix" class="ts-stat-suffix"></span>
            </div>
            <div id="rightProgressRow" class="ts-progress-row">
              <div class="ts-progress-track">
                <div id="rightBarFill" class="ts-progress-fill"></div>
              </div>
              <span id="rightPercent" class="ts-progress-label"></span>
            </div>
          </div>
        </div>
        <div id="splitFooter" class="ts-stat-footer"></div>
      </div>
    </div>

    <!-- Main + Secondary layout (compact: big primary, footer line below
         combining secondary value · footer value) -->
    <div id="mainSecLayout" class="ts-main-sec hidden">
      <div class="ts-detail-card">
        <span class="ts-icon-corner" data-icon-slot aria-hidden="true"></span>
        <div id="msMainRow" class="ts-main-sec-row">
          <div id="msMainLabel" class="ts-side-label"></div>
          <div class="ts-stat-row">
            <span id="msMainValue" class="ts-stat-big"></span>
            <span id="msMainSuffix" class="ts-stat-suffix"></span>
          </div>
        </div>
        <div id="msFooterLine" class="ts-main-sec-footer hidden"></div>
      </div>
    </div>

    <!-- Footer metrics (shared) -->
    <div id="footerMetrics" class="ts-footer-metrics hidden">
      <div class="ts-metric">
        <div id="metric1Label" class="ts-metric-label"></div>
        <div id="metric1Value" class="ts-metric-value"></div>
      </div>
      <div class="ts-metric">
        <div id="metric2Label" class="ts-metric-label"></div>
        <div id="metric2Value" class="ts-metric-value"></div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js" defer></script>
</body>
</html>
