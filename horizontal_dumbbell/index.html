<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Horizontal Dumbbell Chart</title>
        <script src="https://code.highcharts.com/highcharts.js"></script>
        <script src="https://code.highcharts.com/highcharts-more.js"></script>
        <script src="https://code.highcharts.com/modules/dumbbell.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/numeral.js/2.0.6/numeral.min.js"></script>
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background: #FFFFFF;
                font-family: 'Optimo-Plain', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            }
            #chartWrap {
                position: relative;
                width: 100vw;
                height: 100vh;
            }
            #chart {
                width: 100%;
                height: 100%;
            }
            #pagerButtons {
                position: absolute;
                top: 8px;
                right: 16px;
                display: flex;
                gap: 6px;
                align-items: center;
                z-index: 10;
            }
            #pagerButtons.hidden { display: none; }
            .pager-btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 28px;
                height: 28px;
                padding: 0 14px;
                border: none;
                border-radius: 999px;
                background: #F1F2F4;
                color: #1A1F2C;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
                font-family: Optimo-Plain, "Helvetica Neue", Helvetica, Arial, sans-serif;
            }
            .pager-btn:hover:not(:disabled) { background: #E4E6EA; }
            .pager-btn.active {
                background: #6B7280;
                color: #FFFFFF;
            }
            .pager-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
        </style>
    </head>
    <body>
        <div id="chartWrap">
            <div id="chart"></div>
            <div id="pagerButtons" class="hidden"></div>
        </div>
        <script type="module" src="dumbbell.ts"></script>
    </body>
</html>
