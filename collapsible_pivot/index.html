<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Collapsible Pivot</title>
        <!-- No Highcharts here: this chart renders a plain HTML table, so
             there's nothing to bundle beyond the SDK + numeral (via the .ts
             imports). No CDN scripts — see LESSONS.md. -->
        <style>
            html, body {
                margin: 0;
                padding: 0;
                background: #FFFFFF;
                font-family: 'Optimo-Plain', 'Helvetica Neue', Helvetica, Arial, sans-serif;
                color: #1A1F2C;
            }
            #layout {
                width: 100vw;
                height: 100vh;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                box-sizing: border-box;
            }
            #chartTitle {
                flex: 0 0 auto;
                font-size: 14px;
                font-weight: 700;
                color: #1A1F2C;
                padding: 10px 12px 6px 12px;
            }
            #chartTitle.hidden { display: none; }
            /* The scroll container. Sticky header rows and the sticky row-label
               columns are positioned against this box. */
            #tableWrap {
                flex: 1 1 auto;
                min-height: 0;
                overflow: auto;
                /* Right padding gives the last column's resize grip (it sits
                   half outside the header cell, on the right edge) somewhere
                   to land instead of butting against the scroll boundary. */
                padding: 0 8px 12px 0;
                box-sizing: border-box;
            }
            table.pivot {
                border-collapse: separate;
                border-spacing: 0;
                font-size: 12px;
                white-space: nowrap;
            }
            table.pivot th, table.pivot td {
                padding: 6px 10px;
                border-bottom: 1px solid #EEF1F4;
                border-right: 1px solid #EEF1F4;
                text-align: right;
                font-weight: 400;
                background: #FFFFFF;
                box-sizing: border-box;
            }
            /* Header cells. Centered, and they WRAP onto extra lines when a
               column is dragged narrow rather than truncating. vertical-align
               bottom keeps a rowspanning label on the same line as the leaf
               column names, so there's no gap under a group title. */
            table.pivot thead th {
                position: sticky;
                background: #F7F8FA;
                font-weight: 600;
                color: #1A1F2C;
                text-align: center;
                vertical-align: middle;
                z-index: 2;
                border-bottom: 1px solid #E4E6EA;
            }
            /* Cells that rowSpan multiple header rows (row labels, a leaf
               header left ungrouped while its neighbours nest deeper, the
               Total column) must bottom-align so their text sits on the same
               line as the deepest row's leaf labels. Plain single-row
               headers stay vertical-align:middle so squeezing a NEIGHBOURING
               column into two lines (growing that row's height) doesn't push
               them to the bottom of the taller row. */
            table.pivot thead th[rowspan] {
                vertical-align: bottom;
            }
            /* Row-label headers (the leftmost attribute columns) rowSpan
               every header row too, but they have no leaf row underneath to
               align with, so they read better centered like everything else. */
            table.pivot thead th.row-head {
                vertical-align: middle;
            }
            /* Group titles read better starting at the left of their span. */
            table.pivot thead th.grp-head { text-align: left; }
            /* Set only on columns with a user-dragged width: wrap onto more
               lines rather than truncate when squeezed. */
            table.pivot thead th.sized {
                white-space: normal;
                overflow-wrap: anywhere;
            }
            /* Row-label cells. Only the ones marked .frozen are pinned —
               how many is the "Freeze first N" setting. */
            table.pivot th.row-head,
            table.pivot td.row-label {
                text-align: left;
                background: #FFFFFF;
            }
            table.pivot th.row-head.frozen,
            table.pivot td.row-label.frozen {
                position: sticky;
                left: 0;
                z-index: 1;
            }
            table.pivot thead th.row-head {
                background: #F7F8FA;
            }
            table.pivot thead th.row-head.frozen { z-index: 3; }
            /* The corner + left columns need an opaque background so body
               cells scrolling underneath them don't show through. */
            table.pivot td.row-label { font-weight: 500; }
            table.pivot tbody tr:hover td { background: #F7F8FA; }
            table.pivot tbody tr:hover td.row-label { background: #F1F2F4; }
            table.pivot.striped tbody tr:nth-child(even) td { background: #FCFCFD; }
            table.pivot.striped tbody tr:nth-child(even) td.row-label { background: #FAFAFB; }
            table.pivot.no-grid th, table.pivot.no-grid td {
                border-right: none;
            }
            /* Totals */
            table.pivot td.total-cell, table.pivot th.total-head {
                font-weight: 700;
                background: #F7F8FA;
            }
            table.pivot tbody tr.grand-total td {
                font-weight: 700;
                background: #F1F2F4;
                border-top: 1px solid #D8DBE0;
            }
            /* Collapse / expand affordance in group headers */
            .grp {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                max-width: 100%;
            }
            button.chev {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 15px;
                height: 15px;
                flex: 0 0 auto;
                padding: 0;
                border: none;
                border-radius: 4px;
                background: #E4E6EA;
                color: #1A1F2C;
                cursor: pointer;
                font-size: 13px;
                font-weight: 700;
                line-height: 1;
                font-family: inherit;
                transition: background 0.15s ease;
            }
            button.chev:hover { background: #D3D6DC; }
            .grp-label {
                overflow: hidden;
                text-overflow: ellipsis;
            }
            /* Link cells */
            table.pivot td.row-label a { color: #2A67C8; text-decoration: none; }
            table.pivot td.row-label a:hover { text-decoration: underline; }
            /* Group headers sit above their measure columns */
            table.pivot thead th.grp-head { text-align: left; background: #EEF1F6; }
            /* Column resize grip on the right edge of resizable headers.
               No `position: relative` here — it would override the sticky
               positioning above; sticky is already a containing block. */
            .col-resize {
                position: absolute;
                top: 0;
                right: -3px;
                width: 7px;
                height: 100%;
                cursor: col-resize;
                z-index: 5;
                user-select: none;
            }
            .col-resize:hover { background: #B9C0CC; }
            body.col-resizing { cursor: col-resize; user-select: none; }
            body.col-resizing * { cursor: col-resize !important; }
            /* Resized BODY cells clip rather than force the column open again.
               Headers deliberately wrap instead (see thead rule above). */
            table.pivot tbody td { overflow: hidden; text-overflow: ellipsis; }
            #message {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 100%;
                color: #6B7280;
                font-size: 14px;
                text-align: center;
                padding: 20px;
                box-sizing: border-box;
            }
            #message.hidden { display: none; }
        </style>
    </head>
    <body>
        <div id="layout">
            <div id="chartTitle" class="hidden"></div>
            <div id="tableWrap"></div>
            <div id="message" class="hidden"></div>
        </div>
        <script type="module" src="pivot.ts"></script>
    </body>
</html>
